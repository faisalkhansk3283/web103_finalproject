# Render Blueprint Specification
# https://render.com/docs/blueprints

# PostgreSQL Database
databases:
  - name: walletwatch-db
    plan: free
    databaseName: walletwatch
    ipAllowList: []

# Web Service (Backend + Frontend)
services:
  - type: web
    name: walletwatch
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd client && npm install --include=dev && ./node_modules/.bin/vite build && cd ../server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: walletwatch-db
          property: connectionString
