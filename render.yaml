# Render Blueprint Specification
# https://render.com/docs/blueprints

# PostgreSQL Database
databases:
  - name: walletwatch-db
    plan: free
    databaseName: walletwatch
    ipAllowList: []

# Web Service (Backend + Frontend)
services:
  - type: web
    name: walletwatch
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: walletwatch-db
          property: connectionString
